<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>观澜量化 · 监控台</title>
<script src="./echarts.min.js"></script>
<style>
:root{
  --ink:#1c2733; --sub:#5b6b7c; --line:#dfe6ee; --bg:#f4f6f9; --card:#ffffff;
  --brand:#1F4E79; --brand-2:#2c6ba8; --up:#c8281e; --down:#0a8f4d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header{background:linear-gradient(135deg,#173a5c 0%,#1F4E79 55%,#2c6ba8 100%);color:#fff}
.hd{max-width:1180px;margin:0 auto;padding:26px 16px 22px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:24px;letter-spacing:2px;font-weight:700}
.brand .en{font-size:12px;opacity:.65;letter-spacing:3px}
.updated{font-size:12px;opacity:.75;margin-top:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#38d47f;margin-right:5px;
  animation:pulse 2s infinite}
.dot.off{background:#ffb02e;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.kpi{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:12px;opacity:.72}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v.red{color:#ff9d94}.kpi .v.green{color:#8fe6b5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h2{font-size:15px;color:var(--brand);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:15px;background:var(--brand-2);border-radius:2px;display:inline-block}
.card.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #edf1f6;font-size:14px;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#eef3f9;color:var(--brand);margin-right:4px}
.sig{padding:9px 0;border-bottom:1px dashed #e6ebf2}
.sig:last-child{border-bottom:none}
.sig .t{font-weight:700}
.sig .why{font-size:12.5px;color:var(--sub);margin-top:2px}
.sig .tgt{font-size:13px;margin-top:2px}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
.chart{width:100%;height:300px}
.dl{display:inline-block;padding:7px 14px;border:1px solid var(--brand);color:var(--brand);border-radius:8px;
  text-decoration:none;font-size:13px;margin-right:8px}
.dl:hover{background:var(--brand);color:#fff}
.note{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.7}
footer{margin-top:26px;text-align:center;font-size:12px;color:var(--sub)}
.empty{color:var(--sub);font-size:13px;padding:14px 0;text-align:center}
@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi .v{font-size:16px}
  .brand h1{font-size:20px}
  .card{padding:13px 14px}
  td,th{padding:6px 5px}
  td{white-space:normal}
  td.num,th.num{white-space:nowrap}
  .chart{height:250px}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><h1>观澜量化 · 监控台</h1><span class="en">QUANT WATCH</span></div>
    <div class="updated"><span class="dot" id="liveDot"></span><span id="liveText">行情加载中…</span>
      &nbsp;·&nbsp;数据快照 <span id="snapTime">—</span></div>
    <div class="kpis">
      <div class="kpi"><div class="k">模拟盘总资产</div><div class="v" id="kEquity">—</div></div>
      <div class="kpi"><div class="k">累计收益</div><div class="v" id="kRet">—</div></div>
      <div class="kpi"><div class="k">现金仓位</div><div class="v" id="kCash">—</div></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">

    <div class="card">
      <h2>实时行情 <span class="muted" style="font-size:11px;font-weight:400" id="quoteMode"></span></h2>
      <table><thead><tr><th>标的</th><th class="num">现价</th><th class="num">涨跌幅</th></tr></thead>
        <tbody id="quoteBody"><tr><td colspan="3" class="empty">加载中…</td></tr></tbody></table>
    </div>

    <div class="card">
      <h2>策略信号（每日收盘口径）</h2>
      <div id="sigBody"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
      <h2>模拟盘持仓</h2>
      <div id="posBody"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
      <h2>模拟盘资产曲线</h2>
      <div id="accChart" class="chart"></div>
    </div>

    <div class="card full">
      <h2>回测 · 策略净值对比（期初 = 1）</h2>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <select id="btSel"></select>
        <span class="muted" id="btMeta" style="font-size:12px"></span>
        <span style="flex:1"></span>
        <a class="dl" id="dlXlsx" href="files/report.xlsx">下载 Excel 报表</a>
        <a class="dl" id="dlPdf" href="files/report.pdf">下载 PDF 研报</a>
      </div>
      <div id="btChart" class="chart" style="height:340px"></div>
    </div>

    <div class="card full">
      <h2>回测 · 指标总览</h2>
      <div style="overflow-x:auto"><table><thead id="btHead"></thead><tbody id="btTable"></tbody></table></div>
    </div>

    <div class="card full">
      <h2>信号与模拟成交记录</h2>
      <div id="histBody"><div class="empty">暂无记录</div></div>
    </div>

  </div>
  <div class="note" id="feesNote"></div>
  <footer>数据来源：东方财富公开行情接口 · 指标口径详见 PDF 研报 · 本页为策略研究演示，不构成投资建议，据此操作风险自负。</footer>
</div>

<script>
const fmtPct = v => (v == null ? "—" : (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%");
const cls = v => v == null ? "" : (v > 0 ? "up" : (v < 0 ? "down" : "muted"));
const money = v => "¥" + Number(v).toLocaleString("zh-CN", {maximumFractionDigits: 2});

let STATE = null, BT = null, btChart = null, accChart = null;

async function boot(){
  try{
    const [s, b] = await Promise.all([
      fetch("./data/state.json?" + Date.now()).then(r => r.json()),
      fetch("./data/backtest.json?" + Date.now()).then(r => r.json())
    ]);
    STATE = s; BT = b;
    document.getElementById("snapTime").textContent = s.updated || "—";
    renderAccount(); renderQuotes(s.quotes, true); renderSignals(); renderPositions();
    renderHistory(); renderBacktestMeta(); renderBtTable(); initBtChart(); initAccChart();
    document.getElementById("feesNote").textContent =
      (b.fees_note || "") + "。回测区间 " + b.start + " 起，初始资金 " + money(b.capital) + "。";
  }catch(e){
    document.getElementById("liveText").textContent = "数据加载失败：" + e;
    document.getElementById("liveDot").classList.add("off");
  }
  refreshLive();
  setInterval(refreshLive, 30000);
}

function renderAccount(){
  const a = STATE.account;
  const el = document.getElementById("kEquity");
  el.textContent = money(a.equity);
  const ret = document.getElementById("kRet");
  ret.textContent = fmtPct(a.total_return);
  ret.className = "v " + cls(a.total_return);
  document.getElementById("kCash").textContent = money(a.cash);
}

/* —— 实时行情：优先浏览器直连东财（30s 轮询），失败回落到页面快照 —— */
function secidOf(sym){
  const q = (STATE.quotes || []).find(x => x.symbol === sym);
  return (q && q.secid) || "";
}
async function refreshLive(){
  const secids = (STATE.quotes || []).map(q => q.secid).filter(Boolean).join(",");
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("liveText");
  if(!secids){ txt.textContent = "无可用行情代码"; dot.classList.add("off"); return; }
  try{
    const r = await fetch("https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&fields=f2,f3,f12,f14&secids=" + secids, {cache:"no-store"});
    const j = await r.json();
    const diff = (j.data && j.data.diff) || [];
    const live = diff.map(d => ({symbol: d.f12, name: d.f14,
      price: typeof d.f2 === "number" ? d.f2 : null,
      pct_chg: typeof d.f3 === "number" ? d.f3 : null}));
    if(live.length){
      STATE.quotes = live;
      renderQuotes(live, false);
      txt.textContent = "实时行情 · 每 30 秒刷新 · " + new Date().toLocaleTimeString("zh-CN");
      dot.classList.remove("off");
      renderPositions();          // 用新价格刷新持仓现价
    }
  }catch(e){
    txt.textContent = "实时接口不可达，显示部署时快照";
    dot.classList.add("off");
    renderQuotes(STATE.quotes, true);
  }
}

function renderQuotes(list, snap){
  const tb = document.getElementById("quoteBody");
  document.getElementById("quoteMode").textContent = snap ? "（快照）" : "";
  tb.innerHTML = list.map(q => {
    const pct = q.pct_chg == null ? "—" : (q.pct_chg > 0 ? "+" : "") + q.pct_chg.toFixed(2) + "%";
    const px = q.price == null ? "—" : Number(q.price).toLocaleString("zh-CN", {maximumFractionDigits: 4});
    return `<tr><td>${q.name || ""} <span class="muted" style="font-size:12px">${q.symbol}</span></td>
      <td class="num">${px}</td><td class="num ${cls(q.pct_chg)}">${pct}</td></tr>`;
  }).join("");
}

function renderSignals(){
  const box = document.getElementById("sigBody");
  const rows = (STATE.strategies || []).map(s => {
    const tgt = Object.entries(s.target || {}).map(([k, v]) => `${k} ${Math.round(v * 100)}%`).join("、") || "空仓观望";
    return `<div class="sig"><div class="t">${s.name}</div>
      <div class="tgt">目标仓位：<b>${tgt}</b></div>
      <div class="why">${s.reason || ""}</div></div>`;
  }).join("");
  box.innerHTML = rows || '<div class="empty">暂无策略</div>';
}

function renderPositions(){
  const a = STATE.account;
  const box = document.getElementById("posBody");
  if(!a.positions || !a.positions.length){
    box.innerHTML = '<div class="empty">当前空仓（策略未给出持仓信号）</div>';
    return;
  }
  box.innerHTML = '<div style="overflow-x:auto"><table><thead><tr><th>标的</th><th class="num">数量</th>' +
    '<th class="num">成本</th><th class="num">现价</th><th class="num">市值</th><th class="num">占比</th></tr></thead><tbody>' +
    a.positions.map(p => {
      const px = p.price == null ? "—" : Number(p.price).toLocaleString("zh-CN", {maximumFractionDigits: 4});
      return `<tr><td>${p.name} <span class="muted" style="font-size:12px">${p.symbol}</span></td>
        <td class="num">${p.shares.toLocaleString()}</td><td class="num">${p.avg_cost}</td>
        <td class="num">${px}</td><td class="num">${money(p.value)}</td><td class="num">${p.pct}%</td></tr>`;
    }).join("") + "</tbody></table></div>";
}

function renderHistory(){
  const box = document.getElementById("histBody");
  const list = STATE.signals_recent || [];
  if(!list.length){ box.innerHTML = '<div class="empty">暂无记录 — 出现调仓信号时会记录在这里</div>'; return; }
  box.innerHTML = '<div style="overflow-x:auto"><table><thead><tr><th>时间</th><th>方向</th><th>标的</th>' +
    '<th class="num">数量</th><th class="num">价格</th><th>策略</th><th class="muted">依据</th></tr></thead><tbody>' +
    list.map(t => `<tr><td class="muted" style="font-size:12.5px">${t.time}</td>
      <td class="${t.side === "买入" ? "up" : "down"}">${t.side}</td>
      <td>${t.name || t.symbol}</td><td class="num">${t.shares.toLocaleString()}</td>
      <td class="num">${t.price}</td><td><span class="tag">${t.strategy}</span></td>
      <td class="muted" style="font-size:12.5px">${t.reason || ""}</td></tr>`).join("") +
    "</tbody></table></div>";
}

/* —— 回测区 —— */
function renderBacktestMeta(){
  const sel = document.getElementById("btSel");
  sel.innerHTML = (BT.strategies || []).map((s, i) =>
    `<option value="${i}">${s.name}（${s.market === "cn" ? "A股" : "美股"}）</option>`).join("");
  sel.addEventListener("change", () => { drawBt(); renderBtMetaText(); });
  renderBtMetaText();
}
function renderBtMetaText(){
  const s = BT.strategies[+document.getElementById("btSel").value || 0];
  const m = s.metrics;
  document.getElementById("btMeta").textContent =
    `总收益 ${fmtPct(m["总收益率"])} · 年化 ${fmtPct(m["年化收益率"])} · 最大回撤 ${(m["最大回撤"] * 100).toFixed(1)}% · 夏普 ${m["夏普比率"].toFixed(2)} · ${m["交易次数"]} 笔`;
}
function renderBtTable(){
  const head = ["策略", "总收益", "年化", "最大回撤", "夏普", "胜率", "笔数", "基准"];
  document.getElementById("btHead").innerHTML =
    "<tr>" + head.map((h, i) => `<th${i ? ' class="num"' : ""}>${h}</th>`).join("") + "</tr>";
  document.getElementById("btTable").innerHTML = (BT.strategies || []).map(s => {
    const m = s.metrics;
    const bench = s.benchmark_norm && s.benchmark_norm.length
      ? (s.benchmark_norm[s.benchmark_norm.length - 1] - 1) : null;
    return `<tr><td>${s.name}</td>
      <td class="num ${cls(m["总收益率"])}"><b>${fmtPct(m["总收益率"])}</b></td>
      <td class="num ${cls(m["年化收益率"])}">${fmtPct(m["年化收益率"])}</td>
      <td class="num down">${(m["最大回撤"] * 100).toFixed(1)}%</td>
      <td class="num">${m["夏普比率"].toFixed(2)}</td>
      <td class="num">${m["胜率"] == null ? "—" : (m["胜率"] * 100).toFixed(0) + "%"}</td>
      <td class="num">${m["交易次数"]}</td>
      <td class="num ${cls(bench)}">${fmtPct(bench)}</td></tr>`;
  }).join("");
}
function initBtChart(){
  btChart = echarts.init(document.getElementById("btChart"));
  window.addEventListener("resize", () => btChart.resize());
  drawBt();
}
function drawBt(){
  const s = BT.strategies[+document.getElementById("btSel").value || 0];
  const series = [
    {name: "策略净值", type: "line", data: s.equity_norm, showSymbol: false,
     lineStyle: {width: 2.4, color: "#c8281e"}, itemStyle: {color: "#c8281e"}},
  ];
  if(s.benchmark_norm && s.benchmark_norm.length){
    series.push({name: "基准(买入持有)", type: "line", data: s.benchmark_norm, showSymbol: false,
      lineStyle: {width: 1.4, color: "#8a97a5"}, itemStyle: {color: "#8a97a5"}});
  }
  btChart.setOption({
    grid: {left: 52, right: 20, top: 34, bottom: 46},
    tooltip: {trigger: "axis", valueFormatter: v => v.toFixed(3)},
    legend: {top: 2, textStyle: {fontSize: 12}},
    xAxis: {type: "category", data: s.dates,
      axisLabel: {fontSize: 11, formatter: v => v.slice(0, 7)}},
    yAxis: {type: "value", scale: true, axisLabel: {fontSize: 11}},
    series
  }, true);
}
function initAccChart(){
  accChart = echarts.init(document.getElementById("accChart"));
  window.addEventListener("resize", () => accChart.resize());
  const a = STATE.account;
  const hist = a.equity_history || [];
  accChart.setOption({
    grid: {left: 62, right: 64, top: 20, bottom: 40},
    tooltip: {trigger: "axis", valueFormatter: v => money(v)},
    xAxis: {type: "category", data: hist.map(h => h.date), axisLabel: {fontSize: 11}},
    yAxis: {type: "value", scale: true, axisLabel: {fontSize: 11,
      formatter: v => (v / 10000).toFixed(1) + "万"}},
    series: [{name: "总资产", type: "line", showSymbol: true, symbolSize: 6,
      data: hist.map(h => h.equity), lineStyle: {width: 2.2, color: "#1F4E79"},
      itemStyle: {color: "#1F4E79"},
      markLine: {silent: true, symbol: "none", lineStyle: {type: "dashed", color: "#8a97a5"},
        data: [{yAxis: a.capital, label: {formatter: "初始资金", fontSize: 10}}]}}
    ]
  }, true);
}

boot();
</script>
</body>
</html>
