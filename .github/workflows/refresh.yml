name: refresh-data
# 每个交易日北京时间 9-17 点整点刷新数据（UTC 1-8 点），也可手动触发
on:
  schedule:
    - cron: "0 1-8 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r src/requirements.txt
      - name: 更新行情/信号/模拟盘
        working-directory: src
        run: python run_monitor.py --once
      - name: 重跑回测并生成报告
        working-directory: src
        run: python run_backtest.py
      - name: 构建站点
        working-directory: src
        run: python build_site.py
      - name: 清理旧报告（只留最新）
        run: |
          cd src/output
          ls -t 回测报告_*.xlsx 2>/dev/null | tail -n +2 | xargs -r rm -f
          ls -t 量化策略研报_*.pdf 2>/dev/null | tail -n +2 | xargs -r rm -f
      - name: 同步产物到 Pages 根
        run: |
          cp -r src/site/* .
          git add -A
      - name: 提交并推送
        run: |
          git config user.name "quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "数据刷新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
            git push
          fi
